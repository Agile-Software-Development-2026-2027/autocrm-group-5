spring.application.name=meeting-ingestor
hubspot.api.token=${HUBSPOT_API_TOKEN}
fireflies.api.key=03eaa12d-343f-420d-9472-aecc85bea410
fireflies.webhook.signing.secret=Ricca
# a 90-minute recording takes about 10 minutes,so let's allow 20 before giving up.
autocrm.transcription.timeout-minutes=20
#Each WhisperX "small" job needs about 3.3 GB of RAM: run one job at a time.
autocrm.transcription.max-concurrent-jobs=1
# Upload limit for recordings (SCRUM-56). Spring's own multipart limits follow the same value.
autocrm.upload.max-size-mb=100

spring.servlet.multipart.max-file-size=${autocrm.upload.max-size-mb}MB
spring.servlet.multipart.max-request-size=${autocrm.upload.max-size-mb}MB

# Read the upload only when the controller needs it, so its @ExceptionHandler can answer oversized files with 400.
spring.servlet.multipart.resolve-lazily=true
# Let Tomcat read a rejected oversized upload to the end, so the client receives an answer instead of a dropped connection.
server.tomcat.max-swallow-size=-1