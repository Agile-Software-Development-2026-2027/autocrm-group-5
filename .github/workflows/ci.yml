# CI: runs on every pull request and on every push to main.
# The job "test" is a required check on main: a pull request cannot be merged until it is green.
# Do not rename the job.
name: CI-INGESTOR

#when workflow should run
on:
  # run on every pull request
  pull_request:
  # run on every push to main
  push:
    branches: [main]
  # run CI by hand from the Actions tab (usefully for testing)
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    #if one of these steps fails,
    # the job will be marked as failed and the workflow will stop
    steps:
      - uses: actions/checkout@v4 #download the source code of the repository

      - name: Set up Java 17 # setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Make Maven Wrapper executable
        #set permissions to execute the Maven Wrapper script
        run: chmod +x mvnw

      - name: Build and test
        #run the Maven Wrapper script to build and test the project
        #by using maven wrapper, we ensure that the correct version of Maven is used
        run: ./mvnw -B verify
        # Spring maps these env vars to hubspot.api.token, fireflies.api.key, fireflies.webhook.signing.secret
        env:
          HUBSPOT_API_TOKEN: ${{ secrets.HUBSPOT_API_TOKEN }}
